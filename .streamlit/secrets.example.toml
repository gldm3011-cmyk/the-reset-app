# Cuenta de administrador inicial (se crea la primera vez que arranca la app).
ADMIN_EMAIL = "admin@su-dominio.co"
ADMIN_PASSWORD = "UnaClaveLargaYSegura2027"

# Responsable del tratamiento de datos (aparece en la política que aceptan los usuarios).
RESPONSABLE_NOMBRE = "The Reset S.A.S."
RESPONSABLE_NIT = "900.000.000-0"
RESPONSABLE_CORREO = "datos@su-dominio.co"
